name: CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ai-slop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: CLI typecheck
        run: npm run cli:typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: CLI build
        run: npm run cli:build

  pagespeed:
    name: PageSpeed Insights
    needs: verify
    if: >-
      vars.PAGESPEED_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PageSpeed Insights
        env:
          PAGESPEED_INSIGHTS_API_KEY: ${{ secrets.PAGESPEED_INSIGHTS_API_KEY }}
          PAGESPEED_TARGET_URL: https://giga-site.com/
          PAGESPEED_STRATEGIES: mobile
          PAGESPEED_MIN_PERFORMANCE: "70"
        run: npm run pagespeed:check

      - name: Upload PageSpeed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagespeed-insights
          path: pagespeed-results
          if-no-files-found: ignore

  react-doctor:
    name: React Doctor
    needs: verify
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run React Doctor 100-point gate
        run: npm run react-doctor:check

  deploy:
    name: Deploy Cloudflare Worker
    needs: verify
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, ai-slop-hermes]
    environment: production
    env:
      PRODUCTION_WRANGLER_CONFIG: .wrangler.production.jsonc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure self-hosted toolchain
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          node --version
          npm --version
          npx wrangler --version

      - name: Install dependencies
        run: npm ci

      - name: Prepare private Wrangler config
        run: |
          test -s "$HOME/.config/ai-slop/wrangler.jsonc"
          install -m 600 "$HOME/.config/ai-slop/wrangler.jsonc" "$PRODUCTION_WRANGLER_CONFIG"

      - name: Validate Worker bundle
        run: |
          npm run build
          CI=1 npx wrangler deploy --dry-run --config "$PRODUCTION_WRANGLER_CONFIG"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ai-slop --remote --config "$PRODUCTION_WRANGLER_CONFIG"

      - name: Deploy Worker
        run: npx wrangler deploy --config "$PRODUCTION_WRANGLER_CONFIG"

      - name: Remove private Wrangler config
        if: always()
        run: rm -f "$PRODUCTION_WRANGLER_CONFIG"
