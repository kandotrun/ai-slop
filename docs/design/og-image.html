<html lang="ja">

    <meta charset="utf-8" />
    <style>
      :root {
        --primary: #4f46e5;
        --primary-strong: #4338ca;
        --ink: #14141f;
        --muted: #6b6b7b;
        --bevel: inset 0 1px 0 0 rgba(255, 255, 255, 0.6);
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }

        overflow: hidden;
      }

      .brand-name { font-family: "Yuji Syuku GigaSite", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 34px; font-weight: 400; letter-spacing: 0.02em; color: var(--ink); }

      h1 { font-size: 60px; line-height: 1.13; letter-spacing: -0.035em; font-weight: 800; }
      h1 .ac { color: var(--primary); }
      .sub { margin-top: 20px; font-size: 19px; line-height: 1.6; color: #44444f; max-width: 520px; }

      .pills { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
      .pill { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px;
        font-size: 15px; font-weight: 700; color: var(--primary-strong);
        background-color: #eceaff; background-image: linear-gradient(to bottom, rgba(255,255,255,0.7), rgba(79,70,229,0.06));
        border: 1px solid #d6d2fb; box-shadow: var(--bevel); }
      .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: var(--bevel); }

      /* Right: retro-cute browser mockup of the new UI */
      .demo { align-self: center; }
      .browser { border-radius: 16px; overflow: hidden; border: 1px solid #d7d6e6;
        box-shadow: var(--bevel), 0 26px 60px -22px rgba(40, 40, 90, 0.4); background: #fff; }
      .bbar { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background-image: linear-gradient(to bottom, #fbfbfe, #eef0f6); border-bottom: 1px solid #e6e6ef; }
      .tl { width: 11px; height: 11px; border-radius: 50%; box-shadow: var(--bevel); }
      .url { margin-left: 10px; flex: 1; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--muted);
        background: #fff; border: 1px solid #e4e4ef; border-radius: 999px; padding: 5px 12px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
      .bbody { padding: 18px; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
      .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 9px; font-size: 13px; font-weight: 700;
        color: #fff; background-color: var(--primary); border: 1px solid var(--primary-strong);
        background-image: linear-gradient(to bottom, rgba(255,255,255,0.3), rgba(255,255,255,0) 45%, rgba(0,0,0,0.18));
        box-shadow: var(--bevel), 0 1px 2px rgba(0,0,0,0.2); }
      table { width: 100%; border-collapse: collapse; border: 1px solid #e3e3ee; border-radius: 11px; overflow: hidden; font-size: 13.5px; }
      th { text-align: left; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); background: #f1f2f8; padding: 9px 13px; font-weight: 700; }
      td { padding: 11px 13px; border-top: 1px solid #ededf4; }
      tbody tr:nth-child(even) td { background: #f7f7fc; }
      .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; box-shadow: var(--bevel); }
      .b-ok { color: #fff; background-color: #3f9e42; background-image: linear-gradient(to bottom, rgba(255,255,255,0.35), rgba(0,0,0,0.1)); }
      .b-ac { color: var(--primary-strong); background-color: #eceaff; }
      .st { font-weight: 700; }
      .st-ok { color: #3f9e42; }
      .st-mut { color: var(--muted); }
    </style>
  </head>

        <h1>HTMLを、<br /><span class="ac">認証付きURL</span>で<br />安全に共有。</h1>
        <p class="sub">AIで作った HTML / zip を、パスワード・メール・会社ドメイン認証付きで。サーバー不要、数秒で公開。</p>

          <span class="pill"><span class="dot"></span>認証付き</span>
          <span class="pill"><span class="dot"></span>サーバー不要</span>
        </div>
      </div>
